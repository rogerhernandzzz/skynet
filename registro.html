<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Skynet</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.9), rgba(26, 31, 58, 0.9));
        }

        .auth-card {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.95), rgba(18, 18, 26, 0.95));
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            padding: 3rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgb(59, 130, 246);
            background: rgba(59, 130, 246, 0.05);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            background: rgb(59, 130, 246);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: rgb(37, 99, 235);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-footer p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
        }

        .auth-footer a {
            color: rgb(59, 130, 246);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover {
            color: rgb(37, 99, 235);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .success-message {
            color: #51cf66;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .face-id-section {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 4px;
            padding: 1.5rem;
            margin: 2rem 0;
            text-align: center;
        }

        .face-id-section h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .face-id-button {
            background: transparent;
            border: 1px solid rgb(59, 130, 246);
            color: rgb(59, 130, 246);
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .face-id-button:hover {
            background: rgb(59, 130, 246);
            color: white;
        }

        .face-id-status {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>SKYNET</h1>
                <p>Únete a la Resistencia</p>
            </div>

            <form id="registroForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Tu nombre de usuario"
                        required
                    >
                    <div class="error-message" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                    >
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="cedula">Cédula de Identidad</label>
                    <input
                        type="text"
                        id="cedula"
                        name="cedula"
                        placeholder="V-12345678"
                        required
                    >
                    <div class="error-message" id="cedulaError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo 8 caracteres"
                        required
                    >
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirma tu contraseña"
                        required
                    >
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>

                <!-- Face ID Section -->
                <div class="face-id-section">
                    <h3>🔒 Verificación Biométrica</h3>
                    <p style="margin-bottom: 1rem; font-size: 0.875rem; color: rgba(255, 255, 255, 0.7);">
                        Agrega Face ID para mayor seguridad (opcional)
                    </p>
                    <button
                        type="button"
                        class="face-id-button"
                        id="faceIdBtn"
                        onclick="initiateFaceID()"
                    >
                        📷 Registrar Face ID
                    </button>
                    <div class="face-id-status" id="faceIdStatus"></div>
                </div>

                <button type="submit" class="btn-submit">
                    CREAR CUENTA
                </button>

                <div class="success-message" id="successMessage">
                    ✓ Cuenta creada exitosamente
                </div>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes cuenta?
                    <a href="login.html">Inicia sesión aquí</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script>
        const form = document.getElementById('registroForm');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const cedula = document.getElementById('cedula').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validaciones
            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Las contraseñas no coinciden';
                document.getElementById('confirmPasswordError').style.display = 'block';
                return;
            }

            if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'La contraseña debe tener al menos 8 caracteres';
                document.getElementById('passwordError').style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        cedula,
                        password
                    })
                });

                if (response.ok) {
                    document.getElementById('successMessage').style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/verify.html';
                    }, 2000);
                } else {
                    const error = await response.json();
                    document.getElementById('emailError').textContent = error.detail || 'Error al registrar';
                    document.getElementById('emailError').style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('emailError').textContent = 'Error de conexión';
                document.getElementById('emailError').style.display = 'block';
            }
        });

        function initiateFaceID() {
            const status = document.getElementById('faceIdStatus');
            status.textContent = '📷 Iniciando cámara...';
            status.style.color = 'rgba(59, 130, 246, 1)';

            // Aquí iría la integración real con Face API
            // Por ahora es simulado
            setTimeout(() => {
                status.textContent = '✓ Face ID registrado correctamente';
                status.style.color = '#51cf66';
            }, 2000);
        }
    </script>
</body>
</html>
